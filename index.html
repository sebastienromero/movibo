<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartes de Bogotá</title>
    <style>
      body {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: center;
        gap: 16px;
        max-width: 440px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        padding: 16px;
        font-family: sans-serif;
      }

      .btn {
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
        display: flex;
        aspect-ratio: 1;
        justify-content: center;
        align-items: center;
        padding: 16px;
        border: 2px solid #333;
        border-radius: 10px;
        text-align: center;
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
          .btn img {
        width: 75px;
        height: 75px;
        object-fit: contain;
      }

      .btn:last-child:nth-child(odd) {
        grid-column: 1 / -1;
        justify-self: center;
        width: calc((100% - 16px) / 2);
      }

      .btn:focus-visible {
        outline: 3px solid #1261a0;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <a href="blog.html" class="btn">Ideas urbanas para Bogotá</a>
    <a href="pistes.html" class="btn">
      <img src="/data/images/ciclorrutas.jpeg" alt="" width="56" height="56" />
      <span>Red ciclorrutas</span>
    </a>
    <a href="transmilenio.html" class="btn">
      <img src="/data/images/transmilenio.svg" alt="" width="56" height="56" />
      <span>Red TransMilenio</span>
    </a>
    <a href="sitp.html" class="btn">
      <img src="/data/images/sitp.svg" alt="" width="56" height="56" />
      <span>Paraderos SITP</span>
    </a>
  </body>
</html>
